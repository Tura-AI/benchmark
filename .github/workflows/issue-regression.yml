name: Issue regression

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  issue-tests:
    name: Issue ${{ matrix.issue }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - issue: 3
            test: tests/model_configuration.test.mjs
          - issue: 4
            test: tests/setup.test.mjs
          - issue: 5
            test: tests/batch_execution.test.mjs
          - issue: 6
            test: tests/run_directory.test.mjs
          - issue: 7
            test: tests/intervention.test.mjs
          - issue: 8
            test: tests/cohort_contract.test.mjs
          - issue: 9
            test: tests/result_intake.test.mjs
          - issue: 10
            test: tests/result_schema.test.mjs
          - issue: 11
            test: tests/repository_task.test.mjs
          - issue: 12
            test: tests/mcp_replay.test.mjs
          - issue: 13
            test: tests/observability_reconciliation.test.mjs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run issue ${{ matrix.issue }} regression
        run: node --test "${{ matrix.test }}"

  full-suite:
    name: Full test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  contracts:
    name: Type and schema contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: npm ci
      - run: python -m pip install -r requirements.txt
      - run: npm run typecheck
      - run: npm run schema:check
        env:
          TURA_BENCHMARK_PYTHON: python
      - run: npm run links:check
