id = "mcp_workspace"
name = "MCP Workflow"
description = "Call one tool exposed by the task-local stateful workflow MCP server."
core = false
category = "mcp"
execution = "one_shot"
state_machine = "default_command"
supports_macro_command = true
mutating = true
network = false

[runtime]
binary = "tura-command-mcp-stdio-bridge"
entry = ""
language = "rust"

[limits]
default_timeout_ms = 120000
max_timeout_ms = 300000

[paths]
prompt = "prompt.md"
schema = "schema.json"
policy = "policy.toml"
